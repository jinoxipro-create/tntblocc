name: build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'
      - name: build
        run: |
          FILE=$(find . -name settings.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$FILE" ]; then
            echo "settings.gradle introuvable : les fichiers du mod ne sont pas sur GitHub"
            exit 1
          fi
          cd "$(dirname "$FILE")"
          gradle build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bloctnt-jar
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-sources.jar
